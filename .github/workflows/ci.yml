name: Compile and palettes
on: [push, pull_request]
jobs:
  byte-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['27.1', '28.2', '29.4', '30.1', 'snapshot']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}
      - name: Check palette generation
        run: |
          python3 tools/generate-palettes.py --check
          python3 -m unittest discover -s test -p 'test_*.py' -v
      - name: Byte-compile shared libraries
        run: |
          emacs -Q --batch -L . --eval "(setq byte-compile-error-on-warn t)" -f batch-byte-compile madoromi-palette.el madoromi.el
      - name: Load all themes
        run: |
          emacs -Q --batch -L . -l madoromi-haru-hiru-theme.el -l madoromi-haru-yoru-theme.el -l madoromi-natsu-hiru-theme.el -l madoromi-natsu-yoru-theme.el -l madoromi-aki-hiru-theme.el -l madoromi-aki-yoru-theme.el -l madoromi-fuyu-hiru-theme.el -l madoromi-fuyu-yoru-theme.el
